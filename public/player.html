<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emby Guess Game - Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .player-name {
            font-size: 1.2rem;
            color: #e94560;
        }

        .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff6b6b;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .timer-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff6b6b;
        }

        .timer-overlay.urgent {
            color: #ff0000;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .guess-section {
            margin-bottom: 20px;
        }

        .guess-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #333;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        .guess-input:focus {
            border-color: #e94560;
        }

        .guess-input::placeholder {
            color: #666;
        }

        .guess-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-section.correct {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
        }

        .result-section.incorrect {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #F44336;
        }

        .result-section.winner {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #FFC107;
        }

        .result-text {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .correct-answer {
            font-size: 1.5rem;
            color: #e94560;
            font-weight: bold;
        }

        .scoreboard {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
        }

        .scoreboard h2 {
            margin-bottom: 15px;
            color: #e94560;
            font-size: 1.3rem;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        .player-row.current {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
        }

        .player-row .name {
            font-weight: bold;
        }

        .player-row .points {
            color: #ff6b6b;
            font-weight: bold;
        }

        .waiting {
            text-align: center;
            color: #888;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="player-name" id="playerName">Player</div>
            <div class="score">Score: <span id="score">0</span></div>
        </div>
        
        <div class="video-container">
            <video id="video" autoplay muted></video>
            <div class="timer-overlay" id="timer">--</div>
        </div>
        
        <div class="guess-section">
            <input type="text" class="guess-input" id="guessInput" placeholder="Enter movie name..." disabled>
            <button class="submit-btn" id="submitBtn" disabled>Submit Guess</button>
        </div>
        
        <div class="result-section" id="resultSection">
            <div class="result-text" id="resultText">---</div>
            <div class="correct-answer" id="correctAnswer">---</div>
        </div>
        
        <div class="scoreboard">
            <h2>🏆 Scoreboard</h2>
            <div id="scoreboardList">
                <div class="waiting">Waiting for game to start...</div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const playerNameEl = document.getElementById('playerName');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const guessInput = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const resultSection = document.getElementById('resultSection');
        const resultText = document.getElementById('resultText');
        const correctAnswer = document.getElementById('correctAnswer');
        const scoreboardList = document.getElementById('scoreboardList');

        let hls = null;
        let ws = null;
        let playerName = localStorage.getItem('playerName');
        let hasGuessed = false;

        // Redirect if no name
        if (!playerName) {
            window.location.href = '/';
        }

        playerNameEl.textContent = playerName;

        // Connect to WebSocket
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws?room=default`);
            
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', role: 'player', name: playerName }));
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onclose = () => {
                setTimeout(connect, 3000);
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'round_start':
                    startRound(data.round, data.clipUrl);
                    break;
                case 'round_end':
                    endRound(data.winner, data.correctAnswer);
                    break;
                case 'scoreboard':
                    updateScoreboard(data.players);
                    break;
                case 'timer':
                    updateTimer(data.secondsLeft);
                    break;
                case 'error':
                    console.error('Error:', data.message);
                    break;
            }
        }

        function startRound(round, clipUrl) {
            hasGuessed = false;
            resultSection.classList.remove('show', 'correct', 'incorrect', 'winner');
            
            guessInput.disabled = false;
            submitBtn.disabled = false;
            guessInput.value = '';
            guessInput.focus();
            
            // Load video
            if (clipUrl) {
                loadVideo(clipUrl);
            }
        }

        function loadVideo(url) {
            if (hls) {
                hls.destroy();
            }
            
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        function endRound(winner, movieName) {
            guessInput.disabled = true;
            submitBtn.disabled = true;
            
            if (hls) {
                hls.pause();
            }
            
            resultSection.classList.add('show');
            correctAnswer.textContent = movieName;
            
            if (winner === playerName) {
                resultText.textContent = '🎉 You won this round!';
                resultSection.classList.add('winner');
            } else if (hasGuessed) {
                resultText.textContent = '❌ Wrong answer';
                resultSection.classList.add('incorrect');
            } else {
                resultText.textContent = '⏰ Time ran out';
                resultSection.classList.add('incorrect');
            }
        }

        function updateTimer(secondsLeft) {
            timerEl.textContent = secondsLeft;
            
            if (secondsLeft <= 5) {
                timerEl.classList.add('urgent');
            } else {
                timerEl.classList.remove('urgent');
            }
        }

        function updateScoreboard(players) {
            scoreboardList.innerHTML = '';
            
            // Sort by score descending
            const sorted = [...players].sort((a, b) => b.score - a.score);
            
            sorted.forEach((player, index) => {
                const div = document.createElement('div');
                div.className = 'player-row';
                if (player.name === playerName) {
                    div.classList.add('current');
                    scoreEl.textContent = player.score;
                }
                div.innerHTML = `
                    <span class="name">${player.name}</span>
                    <span class="points">${player.score} pts</span>
                `;
                scoreboardList.appendChild(div);
            });
        }

        // Submit guess
        function submitGuess() {
            const guess = guessInput.value.trim();
            if (!guess || hasGuessed) return;
            
            hasGuessed = true;
            guessInput.disabled = true;
            submitBtn.disabled = true;
            
            ws.send(JSON.stringify({ type: 'guess', guess }));
        }

        submitBtn.addEventListener('click', submitGuess);
        guessInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitGuess();
            }
        });

        connect();
    </script>
</body>
</html>
