<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Emby Guess Game - Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 12px 20px;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .room-code { font-size: 0.9rem; color: #888; }
        .score-badge {
            background: #e94560;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .video-section {
            position: relative;
            background: #000;
            width: 100%;
            aspect-ratio: 16/9;
            max-height: 35vh;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        .video-overlay {
            position: absolute;
            bottom: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .timer-pill {
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 1.4rem;
            font-weight: bold;
        }
        .timer-pill.guessing { color: #ff6b6b; }
        .timer-pill.urgent { color: #ff0000; animation: pulse 0.5s infinite; }
        .timer-pill.revealing { color: #4CAF50; }
        .round-pill {
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #aaa;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .guess-section { flex: 1; padding: 15px 20px; display: flex; flex-direction: column; }
        .status-bar {
            text-align: center;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .status-bar.waiting { background: rgba(136,136,136,0.15); color: #888; }
        .status-bar.listening { background: rgba(233,69,96,0.15); color: #e94560; }
        .status-bar.submitted { background: rgba(76,175,80,0.15); color: #4CAF50; }
        .status-bar.result { background: rgba(76,175,80,0.2); color: #4CAF50; font-size: 1.3rem; }
        .input-area { display: flex; gap: 10px; }
        #guessInput {
            flex: 1;
            padding: 14px 18px;
            font-size: 1.1rem;
            border: 2px solid #333;
            border-radius: 10px;
            background: #1a1a1a;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }
        #guessInput:focus { border-color: #e94560; }
        #guessInput:disabled { opacity: 0.4; }
        #submitBtn {
            padding: 14px 24px;
            font-size: 1.1rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        #submitBtn:active { transform: scale(0.95); }
        #submitBtn:disabled { background: #444; cursor: default; }
        .scoreboard {
            background: rgba(255,255,255,0.03);
            border-top: 1px solid #222;
            padding: 10px 20px;
        }
        .scoreboard h3 { font-size: 0.8rem; color: #666; text-transform: uppercase; margin-bottom: 6px; }
        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.95rem;
        }
        .score-row .name { color: #ccc; }
        .score-row .pts { color: #ff6b6b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="room-code">Room: <span id="roomCode">---</span></div>
        <div class="score-badge">Score: <span id="myScore">0</span></div>
    </div>
    <div class="video-section">
        <video id="video" muted playsinline></video>
        <div class="video-overlay">
            <div class="round-pill">Round <span id="roundNum">0</span></div>
            <div class="timer-pill" id="timerPill" style="display:none">--</div>
        </div>
    </div>
    <div class="guess-section">
        <div class="status-bar waiting" id="statusBar">Joining game...</div>
        <div class="input-area">
            <input type="text" id="guessInput" placeholder="Type movie name..." disabled autocomplete="off">
            <button id="submitBtn" disabled>Guess</button>
        </div>
    </div>
    <div class="scoreboard">
        <h3>Scores</h3>
        <div id="scoreList"></div>
    </div>
    <script>
        const video = document.getElementById('video');
        const guessInput = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusBar = document.getElementById('statusBar');
        const timerPill = document.getElementById('timerPill');
        const roundNumEl = document.getElementById('roundNum');
        const roomCodeEl = document.getElementById('roomCode');
        const myScoreEl = document.getElementById('myScore');
        const scoreList = document.getElementById('scoreList');

        let hls = null, ws = null, currentRound = null;
        let myScore = 0, myId = null;
        let countdownInterval = null;

        function setStatus(text, type) {
            statusBar.textContent = text;
            statusBar.className = 'status-bar ' + type;
        }

        function connect() {
            let name = localStorage.getItem('playerName');
            if (!name) {
                name = prompt('Enter your name to join:');
                if (!name) { setTimeout(connect, 1000); return; }
                localStorage.setItem('playerName', name);
            }
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws?room=default`);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', role: 'player', name }));
                setStatus('Connected! Waiting for round...', 'waiting');
            };
            ws.onmessage = (event) => {
                try { handleMessage(JSON.parse(event.data)); }
                catch (e) { console.error('Parse error:', e); }
            };
            ws.onclose = () => {
                setStatus('Disconnected. Reconnecting...', 'waiting');
                setTimeout(connect, 3000);
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'round_start':
                    clearCountdown();
                    currentRound = data.round;
                    roundNumEl.textContent = data.round.number;
                    guessInput.value = '';
                    guessInput.disabled = false;
                    submitBtn.disabled = false;
                    setStatus('Guess the movie!', 'listening');
                    timerPill.style.display = 'block';

                    if (data.clipUrl) loadVideo(data.clipUrl);

                    // Local countdown
                    const guessMs = data.guessWindowDuration || 20000;
                    let remaining = Math.ceil(guessMs / 1000);
                    timerPill.textContent = remaining + 's';
                    timerPill.className = 'timer-pill guessing';

                    countdownInterval = setInterval(() => {
                        remaining--;
                        timerPill.textContent = remaining + 's';
                        if (remaining <= 5) timerPill.className = 'timer-pill urgent';
                        if (remaining <= 0) {
                            clearCountdown();
                            guessInput.disabled = true;
                            submitBtn.disabled = true;
                            setStatus("Time's up!", 'waiting');
                            timerPill.style.display = 'none';
                        }
                    }, 1000);
                    break;
                case 'guess_feedback':
                    if (data.correct) {
                        clearCountdown();
                        setStatus('Correct!', 'result');
                        guessInput.disabled = true;
                        submitBtn.disabled = true;
                        timerPill.style.display = 'none';
                    } else {
                        setStatus('Wrong! Try again...', 'listening');
                    }
                    break;
                case 'round_end':
                    clearCountdown();
                    setStatus(`Answer: ${data.correctAnswer}`, 'result');
                    guessInput.disabled = true;
                    submitBtn.disabled = true;
                    timerPill.style.display = 'none';
                    break;
                case 'scoreboard':
                    updateScoreboard(data.players);
                    break;
                case 'error':
                    setStatus(data.message, 'waiting');
                    break;
            }
        }

        function clearCountdown() {
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        }

        function loadVideo(url) {
            if (hls) hls.destroy();
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(() => {});
            }
        }

        function submitGuess() {
            const guess = guessInput.value.trim();
            if (!guess || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: 'guess', guess }));
            guessInput.value = '';
            setStatus('Guess sent!', 'submitted');
        }

        submitBtn.addEventListener('click', submitGuess);
        guessInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitGuess(); });

        function updateScoreboard(players) {
            scoreList.innerHTML = '';
            [...players].sort((a, b) => b.score - a.score).forEach(p => {
                const row = document.createElement('div');
                row.className = 'score-row';
                row.innerHTML = `<span class="name">${p.name}</span><span class="pts">${p.score}</span>`;
                scoreList.appendChild(row);
            });
            const me = players.find(p => p.name === localStorage.getItem('playerName'));
            if (me) myScoreEl.textContent = me.score;
        }

        fetch('/api/code?room=default').then(r => r.json()).then(d => roomCodeEl.textContent = d.code);
        connect();
    </script>
</body>
</html>
