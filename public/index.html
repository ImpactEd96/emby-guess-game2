<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emby Guess Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #333;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #e94560;
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-play {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            color: white;
        }

        .btn-display {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid #333;
        }

        .btn-display:hover {
            border-color: #e94560;
        }

        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }

        .footer a {
            color: #e94560;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Guess the Movie</h1>
        <p class="subtitle">How well do you know your movies?</p>
        
        <form id="joinForm">
            <div class="form-group">
                <input type="text" id="playerName" placeholder="Enter your name" required maxlength="20">
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-play" data-role="player">Play Game</button>
                <button type="button" class="btn-display" onclick="setDisplay()">Display on TV</button>
            </div>
        </form>
        
        <div class="footer">
            <a href="/debug.html">Debug Panel</a>
        </div>
    </div>

    <script>
        document.getElementById('joinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('playerName').value.trim();
            if (name) {
                localStorage.setItem('playerName', name);
                window.location.href = '/player.html';
            }
        });

        function setDisplay() {
            window.location.href = '/display.html';
        }

        // Check if name is already saved
        const savedName = localStorage.getItem('playerName');
        if (savedName) {
            document.getElementById('playerName').value = savedName;
        }
    </script>
</body>
</html>
