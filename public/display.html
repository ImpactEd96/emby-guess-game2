<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emby Guess Game - Display</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }
        .container { display: flex; flex-direction: column; height: 100vh; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0,0,0,0.7);
            z-index: 10;
        }
        .room-code { font-size: 1.3rem; font-weight: bold; color: #e94560; }
        .round-badge {
            background: rgba(233,69,96,0.2);
            border: 1px solid #e94560;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1rem;
        }
        .main { flex: 1; display: flex; position: relative; }
        .video-area { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .timer-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: rgba(255,255,255,0.1);
        }
        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 1s linear;
        }
        .timer-fill.urgent { background: linear-gradient(90deg, #ff0000, #ff4444); }
        .timer-fill.reveal { background: linear-gradient(90deg, #4CAF50, #66bb6a); }
        .status-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
        .timer-display {
            font-size: 6rem;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
            line-height: 1;
        }
        .timer-display.guessing { color: #ff6b6b; }
        .timer-display.revealing { color: #4CAF50; }
        .status-label {
            font-size: 1.5rem;
            margin-top: 10px;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            opacity: 0.8;
        }
        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            color: #e94560;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .score-list { flex: 1; overflow-y: auto; }
        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
        }
        .score-row .name { font-weight: bold; }
        .score-row .pts { color: #ff6b6b; font-weight: bold; }
        .reveal-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(76,175,80,0.15);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            text-align: center;
        }
        .movie-title { font-size: 1.8rem; font-weight: bold; color: #e94560; margin-bottom: 10px; }
        .winner-text { font-size: 1.3rem; color: #4CAF50; }
        .waiting {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .waiting h2 { font-size: 2rem; color: #888; margin-bottom: 10px; }
        .waiting p { color: #555; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="room-code">Room: <span id="roomCode">---</span></div>
            <div class="round-badge">Round <span id="roundNumber">0</span></div>
        </div>
        <div class="main">
            <div class="video-area">
                <video id="video" autoplay muted></video>
                <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
                <div class="status-overlay" id="statusOverlay" style="display:none">
                    <div class="timer-display" id="timerDisplay">--</div>
                    <div class="status-label" id="statusLabel"></div>
                </div>
                <div class="waiting" id="waitingScreen">
                    <h2>Waiting for players...</h2>
                    <p>Join on your phone to start</p>
                </div>
            </div>
            <div class="sidebar">
                <h2>Scoreboard</h2>
                <div class="score-list" id="scoreList"></div>
                <div class="reveal-box" id="revealBox">
                    <div class="movie-title" id="movieTitle"></div>
                    <div class="winner-text" id="winnerText"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const video = document.getElementById('video');
        const roomCodeEl = document.getElementById('roomCode');
        const roundNumberEl = document.getElementById('roundNumber');
        const timerFill = document.getElementById('timerFill');
        const statusOverlay = document.getElementById('statusOverlay');
        const timerDisplay = document.getElementById('timerDisplay');
        const statusLabel = document.getElementById('statusLabel');
        const waitingScreen = document.getElementById('waitingScreen');
        const scoreList = document.getElementById('scoreList');
        const revealBox = document.getElementById('revealBox');
        const movieTitleEl = document.getElementById('movieTitle');
        const winnerTextEl = document.getElementById('winnerText');

        let hls = null, ws = null;
        let countdownInterval = null;

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws?room=default`);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'join', role: 'display' }));
            ws.onmessage = (event) => {
                try { handleMessage(JSON.parse(event.data)); }
                catch (e) { console.error('Parse error:', e); }
            };
            ws.onclose = () => setTimeout(connect, 3000);
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'round_start': startRound(data.round, data.clipUrl, data.guessWindowDuration, data.revealDuration); break;
                case 'round_end': endRound(data.winner, data.correctAnswer); break;
                case 'scoreboard': updateScoreboard(data.players); break;
                case 'error': console.error('Error:', data.message); break;
            }
        }

        function startRound(round, clipUrl, guessWindowDuration, revealDuration) {
            if (!round || !round.number) return; // skip empty join round

            clearCountdown();
            waitingScreen.style.display = 'none';
            revealBox.style.display = 'none';
            roundNumberEl.textContent = round.number;

            if (clipUrl) loadVideo(clipUrl + '?t=' + Date.now());

            // Start local countdown for guess window
            const guessMs = guessWindowDuration || 20000;
            let remaining = Math.ceil(guessMs / 1000);

            statusOverlay.style.display = 'block';
            timerDisplay.textContent = remaining;
            timerDisplay.className = 'timer-display guessing';
            statusLabel.textContent = 'Guess the movie!';
            timerFill.style.width = '100%';
            timerFill.className = 'timer-fill';

            countdownInterval = setInterval(() => {
                remaining--;
                timerDisplay.textContent = remaining;
                timerFill.style.width = ((remaining / (guessMs / 1000)) * 100) + '%';
                if (remaining <= 5) timerDisplay.classList.add('urgent');
                if (remaining <= 0) {
                    clearCountdown();
                    timerDisplay.textContent = 'Time!';
                    statusLabel.textContent = 'No correct guess';
                    timerFill.className = 'timer-fill reveal';
                    timerFill.style.width = '0%';
                }
            }, 1000);
        }

        function clearCountdown() {
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        }

        function loadVideo(url) {
            if (hls) hls.destroy();
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(() => {});
            }
        }

        function endRound(winner, movieName) {
            clearCountdown();
            video.pause();
            statusOverlay.style.display = 'none';
            timerFill.style.width = '0%';
            revealBox.style.display = 'block';
            movieTitleEl.textContent = movieName;
            winnerTextEl.textContent = winner ? `${winner} guessed it!` : 'No one guessed it!';
        }

        function updateScoreboard(players) {
            scoreList.innerHTML = '';
            [...players].sort((a, b) => b.score - a.score).forEach(p => {
                const row = document.createElement('div');
                row.className = 'score-row';
                row.innerHTML = `<span class="name">${p.name}</span><span class="pts">${p.score} pts</span>`;
                scoreList.appendChild(row);
            });
        }

        fetch('/api/code?room=default').then(r => r.json()).then(d => roomCodeEl.textContent = d.code);
        connect();
    </script>
</body>
</html>
